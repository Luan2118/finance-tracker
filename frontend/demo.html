<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Demo | Finance Tracker</title>
    <link rel="stylesheet" href="css-style/login-page/general.css">
    <link rel="stylesheet" href="css-style/login-page/login.css">
  </head>
  <body>
    <main class="main-grid">
      <section class="login-grid" aria-labelledby="demo-title" aria-busy="true" id="demo-login">
        <h1 class="welcome-text" id="demo-title">Try Finance Tracker</h1>
        <p class="catchy-text" id="demo-status" role="status">Signing you into the demo. This may take a moment.</p>
        <p class="login-validation" id="demo-error" role="alert" hidden></p>
        <button class="login-button" id="demo-retry" type="button" hidden>Try again</button>
        <a class="register-link" href="index.html">Back to login</a>
        <noscript><p>Enable JavaScript to open the demo, or sign in using the demo account.</p></noscript>
      </section>
    </main>
    <script type="module" src="script/demo.js"></script>
  </body>
</html>
